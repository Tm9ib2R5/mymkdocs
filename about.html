<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N0b0dy - 赛博朋克个人主页</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background-color: #0d1117;
            font-family: 'Share Tech Mono', monospace;
            color: #00f9ff;
            overflow-x: hidden;
            position: relative;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(0, 249, 255, 0.3);
            margin-bottom: 3rem;
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00f9ff;
            animation: flicker 5s infinite alternate;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            color: #00f9ff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            padding: 0.5rem 0;
            transition: all 0.3s;
        }
        
        .nav-links a::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #00f9ff;
            transition: width 0.3s;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-bottom: 4rem;
            align-items: center;
        }
        
        .profile-info {
            padding: 2rem;
            border: 1px solid rgba(0, 249, 255, 0.3);
            border-radius: 8px;
            background: rgba(13, 17, 23, 0.7);
            box-shadow: 0 0 20px rgba(0, 249, 255, 0.1);
        }
        
        .profile-info h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00f9ff;
        }
        
        .info-item {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        
        .info-label {
            width: 120px;
            text-transform: uppercase;
            font-weight: bold;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }
        
        .info-value {
            flex: 1;
            font-size: 1.2rem;
        }
        
        .cyber-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f9ff, transparent);
            margin: 2rem 0;
        }
        
        .btn-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .cyber-octo {
            --neon: #00f9ff;
            --bg: #0d1117;
            display: inline-flex;
            align-items: center;
            padding: .8rem 1.6rem;
            background: var(--bg);
            border: 2px solid var(--neon);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            filter: drop-shadow(0 0 6px var(--neon));
            transition: filter 0.3s, transform 0.2s;
        }
        
        .cyber-octo:hover {
            filter: drop-shadow(0 0 12px var(--neon));
            transform: translateY(-2px);
        }
        
        /* 故障扫描线 */
        .cyber-octo::before {
            content: "";
            position: absolute;
            inset: 0;
            height: 4px;
            background: var(--neon);
            opacity: .6;
            animation: scan 2.2s linear infinite;
        }
        
        @keyframes scan {
            0%   { transform: translateY(-4px); }
            100% { transform: translateY(32px); }
        }
        
        /* SVG 图标 */
        .octocat {
            width: 24px;
            height: 24px;
            fill: var(--neon);
            transition: fill 0.3s;
            margin-right: 8px;
        }
        
        /* 故障效果 */
        .glitch-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            background: linear-gradient(45deg, #ff00ff, #00f9ff, #ff0000);
            mix-blend-mode: screen;
            pointer-events: none;
            animation: glitch 10s infinite alternate;
        }
        
        @keyframes glitch {
            0%, 100% { opacity: 0; transform: translate(0); }
            5% { opacity: 0.1; transform: translate(-2px, 2px); }
            10% { opacity: 0.2; transform: translate(2px, -2px); }
            15% { opacity: 0; transform: translate(0); }
            45% { opacity: 0; transform: translate(0); }
            50% { opacity: 0.3; transform: translate(-4px, 4px); }
            55% { opacity: 0.2; transform: translate(4px, -4px); }
            60% { opacity: 0; transform: translate(0); }
            95% { opacity: 0; transform: translate(0); }
        }
        
        /* 霓虹闪烁效果 */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.7;
            }
        }
        
        /* 背景网格 */
        .grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 249, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 249, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            perspective: 500px;
        }
        
        .terminal {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00f9ff;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 0 15px rgba(0, 249, 255, 0.2);
            font-family: 'Share Tech Mono', monospace;
            height: 100%;
        }
        
        .terminal-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #00f9ff;
        }
        
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .dot-red { background-color: #ff5f57; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #28c940; }
        
        .terminal-title {
            flex: 1;
            text-align: center;
            color: #00f9ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .terminal-content {
            line-height: 1.6;
        }
        
        .terminal-content p {
            margin-bottom: 0.8rem;
        }
        
        .command { color: #ff00ff; }
        
        .response { color: #00f9ff; }
        
        .blink {
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
            border-top: 1px solid rgba(0, 249, 255, 0.3);
            font-size: 0.9rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
            }
            
            header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-links {
                gap: 1rem;
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }
            
            .logo {
                font-size: 1.8rem;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .profile-info h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <script>
        // 添加随机故障效果
        document.querySelectorAll('.cyber-octo').forEach(button => {
            button.addEventListener('mouseenter', () => {
                button.style.animation = 'none';
                setTimeout(() => {
                    button.style.animation = '';
                }, 10);
            });
        });
        
        // 背景网格动画
        const grid = document.querySelector('.grid');
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            grid.style.transform = `translate(${x * -10}px, ${y * -10}px)`;
        });
        
        // 终端打字机效果
        function typeWriter() {
            const elements = document.querySelectorAll('.command, .response');
            elements.forEach(el => {
                const text = el.textContent;
                el.textContent = '';
                let i = 0;
                const speed = Math.random() * 50 + 25;
                
                function type() {
                    if (i < text.length) {
                        el.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    }
                }
                
                setTimeout(type, Math.random() * 1000);
            });
        }
        
        // 页面加载后执行打字效果
        window.addEventListener('load', typeWriter);
    </script>

</html>
